# About us page copy.

# Who built it is the page heading now: the old one described a platform,
# which is not what anyone comes to this page to read about.
heading: "Built with the people who run places like yours."
built_heading: "Why Alfredo exists"
hero_line: "Running a place like yours is complicated. Alfredo takes all of that and turns it into a few simple things to try each week."
built:
  - name: "Why it exists"
    body: "Owners get plenty of tools that say what happened last week. Alfredo was built to say what to try next, and then to say honestly whether it worked."
  - name: "How it was built"
    body: "Every feature started as a question from a working restaurant rather than a product meeting. People who run places have shaped it from the first week."
how_heading: "How we work with you"
how_body: "We learn your place first. Then you connect your POS, with no new hardware and no staff training. What guests say about you, and about the places nearby, helps shape your weekly list. A brewery sees its taproom and a bar sees its bar program, and early partners help decide what we build next."
# the one line worth keeping from the old opening: who this is for
how_close: "Restaurants, bars, cafes, bakeries, food trucks: if you ring sales through a POS, get in touch and we will tell you honestly where the fit stands today."

where_eyebrow: "Where we are"
where_heading: "Early, and honest about it."
# three plain statements, which is why they carry no titles
where:
  - "Tested with a brewpub and live across a 14 location restaurant chain."
  - "Patent pending with the USPTO."
  - "Now taking on a small number of partners, and we work with each of them directly."

form_heading: "Request a demo"
form_lede: "Tell us a little about your place and we will reply within one business day."
# the price in this line is read from the pricing data
form_pos_note: "Choose your system. We will confirm your setup on the demo call."
form_reassure_lead: "Plans from"
# The location choices match the plans, so the answer Sid reads in the
# email is the band the business falls into. The submitted value is the
# label itself: one string, so the two cannot drift.
form_locations:
  legend: "Locations"
  choices: ["1", "2 to 3", "4 to 10", "More than 10"]

# The four places, restored from the home page. Same pictures, same labels,
# same heading, in the v9 style: four even tiles, one row on a laptop and
# two by two on a phone.
places:
  eyebrow: "Built for hospitality"
  heading: "Different places. The same ambition to do better."
  cards:
    - stem: "restaurant-kitchen"
      label: "Restaurants"
      alt: "A cook finishing a dish on a kitchen pass."
    - stem: "bar"
      label: "Bars"
      alt: "A bar at night, a drink on the counter and bottles lit behind it."
    - stem: "brewery"
      label: "Breweries"
      alt: "A brewer holding a glass of beer up to the light beside the tanks."
    # there is no cafe picture in the repository, so the bakery one carries
    # both, which is what its label says
    - stem: "bakery"
      label: "Cafes and bakeries"
      alt: "A baker shaping dough on a floured bench beside racks of bread."
