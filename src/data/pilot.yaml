# About us page copy.

eyebrow: "How we work"
heading: "A platform shaped to your business, not the average one."
lede:
  - "Every venue runs differently, so Alfredo starts with yours."
  - "This is not a consultant who visits once, drops a binder, and disappears. We work alongside you, and the platform keeps measuring after the conversation ends."
  - "Restaurants, bars, cafes, bakeries, food trucks: if you ring sales through a POS, get in touch and we will tell you honestly where the fit stands today."

built_heading: "Built by someone who knows numbers, with someone who runs restaurants."
built:
  - name: "The founder"
    body: "More than ten years studying how people buy, most of it advising Fortune 100 companies on what their customers want. When you join, you work with him directly."
  - name: "The restaurant owner"
    body: "A multi location owner who helped design Alfredo from the very first week. Every feature started as a real question about his own places: which price to change, which pairing to push, which competitor was pulling his regulars away."
built_close: "Running a restaurant is complicated. Alfredo takes all of that and turns it into a few simple things to try each week."

how_heading: "How we work with you"
how:
  - name: "We start by listening"
    body: "First we learn your place: your history, your goals, what you have already tried. No new hardware, no new software, no staff training. You connect your POS and we take it from there."
  - name: "Your reviews count too"
    body: "What guests say about you, and about the places nearby, helps shape your weekly list."
  - name: "Made to fit you"
    body: "A brewery sees its taproom, a bar sees its bar program. Early partners help decide what we build next."

where_eyebrow: "Where we are"
where_heading: "Early, and honest about it."
# three plain statements, which is why they carry no titles
where:
  - "Tested with a brewpub and live across a 14 location restaurant chain."
  - "Patent pending with the USPTO."
  - "Now taking on a small number of partners. Early partners get direct access to the founder."

form_heading: "Request a demo"
form_lede: "Tell us a little about your place and we will reply within one business day."
form_reassure: "We reply within one business day. $300 a month, first six months free for the first 10."
