# Copy for the numbers rule and pricing pages, reused verbatim.

honesty:
  eyebrow: "The numbers rule"
  heading: "We do not make up numbers."
  lede: "Most analytics tools try to impress you with big projected numbers. Alfredo does the opposite. If the data is not there, the number is not there either. Here is the whole promise, in public, so you can hold us to it."
  promises_heading: "Our four promises"
  promises:
    - name: "No invented figures"
      body: "Every dollar Alfredo shows you comes from your own sales. If we cannot trace it, you do not see it. That goes for this website too: every example here is labeled as a sample."
    - name: "Pending means pending"
      body: "When there is not enough data yet, Alfredo says so. It never dresses up a guess with decimals."
    - name: "Verdicts, not victory laps"
      body: "Every test ends one of three ways: it worked, it did nothing, or it backfired. When it backfires, Alfredo says so."
    - name: "No peeking"
      body: "Results stay hidden until a test is finished, so nobody calls it early. Not even us."
  bridge_heading: "Why we built it"
  bridge: "There are tools that report, tools that do your books, and tools that forecast. None of them suggested what to try and then admitted when they were wrong. So we built one."
  quotes_heading: "The rule, in practice"
  quotes:
    # the first card is a paraphrase, so it carries no quotation and no gloss
    - intro: "When Alfredo suggested a pairing to one of our operators, it labeled its own idea very low confidence and suggested trying it small first."
      quote: ""
      gloss: ""
      close: "An assistant that admits when an idea is weak is one you can believe when it says an idea is strong."
    - intro: "On day one with a real client, Alfredo found a cost that was off by 1,370 times. Instead of quietly fixing it, it asked:"
      quote: "Flagged for review. Confirm or dismiss."
      gloss: ""
      close: "Numbers that get quietly changed are numbers you cannot trust."
  cta_heading: "Hold us to it."
  cta_body: "Run Alfredo on your own data and judge it by its verdicts. That is the whole point."
  cta_link: "See how we work with pilot partners"

pricing:
  eyebrow: "Pricing"
  heading: "One flat price. Published right here."
  lede: "Analytics companies make you call sales to find out what the tool costs. We think that is a strange way to start an honest relationship. So here is the number."
  founding_heading: "The first 10 businesses get their first 6 months free."
  founding_body: "Regardless of how many locations you run. Founding partners get direct access to the founder and a real say in what gets built next. After the 6 months, standard pricing applies, and you can leave anytime before that with nothing owed. When the 10 seats are gone, they are gone. We built Alfredo because independent operators deserve the same intelligence the big chains pay analysts for. The free months exist so the first ten can judge Alfredo by its verdicts before paying a dollar."
  tiers:
    - price: "$300"
      unit: "per month"
      body: "Single location. Per business, not per user. Every feature included: the weekly board, the menu lab, customer intelligence, competitive intel, and Ask Alfredo. No setup fee, no implementation project, no training package, no annual contract."
    - price: "$500"
      unit: "per month"
      body: "Two locations, everything included, one combined view across both rooms."
    - price: "3+"
      unit: "locations"
      body: "Larger groups are priced by conversation, not by formula. Get in touch and we will give you a straight number."
  compare_eyebrow: "For comparison"
  compare_heading: "What the alternatives cost."
  compare:
    - name: "A BI platform"
      body: "Starts around $30,000 a year before implementation, and you still have to build the dashboards and draw your own conclusions."
    - name: "A back office suite"
      body: "Runs $330 to $750 per location per month. Good at invoices and accounting. It tells you what you spent, not what to try next."
    - name: "A consultant"
      body: "Thousands for a one time report that starts going stale the day it is delivered."
  compare_close: "Alfredo connects to your existing POS system and tells you what to try next. Then it tells you whether it worked. No implementation project. No analyst to hire. No quote to request."
  faq_eyebrow: "Questions"
  faq_heading: "The things operators ask first."
  faq:
    - q: "Which POS systems does Alfredo support?"
      a: "Toast and Clover today. If you run a different system, get in touch and we will tell you honestly whether yours is ready yet."
    - q: "Is there a contract?"
      a: "Month to month. Leave whenever you want. We would rather earn the next month than lock you into it."
    - q: "What counts as a location?"
      a: "A physical place of business: one restaurant, one taproom, one truck. The number of registers or terminals inside it does not matter. A restaurant with three registers is still one location."
    - q: "Does Alfredo know what my dishes cost to make?"
      a: "If you share your recipe and ingredient costs, yes: Alfredo connects them to your sales and adds margin intelligence on top, at no extra charge. If you do not have cost data, everything else works without it."
  cta_heading: "Take one of the 10 seats."
  cta_body: "Founding partner seats go to businesses that want to shape the tool, not just use it."
