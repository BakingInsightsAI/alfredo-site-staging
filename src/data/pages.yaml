# Copy for the numbers rule and pricing pages, reused verbatim.

honesty:
  eyebrow: "The numbers rule"
  heading: "We do not make up numbers."
  lede:
    - "Most analytics tools try to impress you with big projected numbers. Alfredo does the opposite."
    - "If the data is not there, the number is not there either. Here is the whole promise, in public, so you can hold us to it."
  promises_heading: "Our four promises"
  promises:
    - name: "No invented figures"
      body: "Every dollar comes from your own sales. If we cannot trace it, you do not see it."
    - name: "Pending means pending"
      body: "When there is not enough data yet, Alfredo says so. It never dresses up a guess with decimals."
    - name: "Verdicts, not victory laps"
      body: "Every test ends one of three ways: it worked, it did nothing, or it backfired. When it backfires, Alfredo says so."
    - name: "No peeking"
      body: "Results stay hidden until a test is finished, so nobody calls it early. Not even us."
  bridge_heading: "Why we built it"
  bridge: "There are tools that report, tools that do your books, and tools that forecast. None of them suggested what to try and then admitted when they were wrong. So we built one."
  quotes_heading: "The rule, in practice"
  quotes:
    # the first card is a paraphrase, so it carries no quotation and no gloss
    - intro: "Alfredo labeled its own pairing idea very low confidence and said to try it small."
      quote: ""
      gloss: ""
      close: "An assistant that admits when an idea is weak is one you can believe when it says an idea is strong."
    - intro: "On day one with a real client, Alfredo found a cost that was off by 1,370 times. Instead of quietly fixing it, it asked:"
      quote: "Flagged for review. Confirm or dismiss."
      gloss: ""
      close: "Numbers that get quietly changed are numbers you cannot trust."
  cta_heading: "Hold us to it."
  cta_body: "Run Alfredo on your own data and judge it by its verdicts. That is the whole point."

pricing:
  eyebrow: "Pricing"
  heading: "Less than $10 a day, whichever plan you pick."
  lede: "One price for your whole business, not per location and not per user. No setup fee, and month to month."
  founding_heading: "The first 10 businesses get everything free for six months."
  founding_body: "Restaurants, cafes, bakeries, breweries and bars. Every feature, however many locations you run. After that you pay the price for your size, month to month, and that price stays locked for a full year."
  # Every price on the site comes from here. The unit is the same for all
  # three, so it is written once rather than three times.
  price_unit: "a month"
  # The daily figures are deliberate: 99, 199 and 299 a month over 30.44
  # days are 3.25, 6.54 and 9.83, so "less than" is true of each one as
  # written. They are not rounded and they are not hedged.
  tiers:
    - name: "Counter"
      who: "For one location"
      price: "$99"
      per_day: "Less than $3.30 a day"
      per_day_note: "One price, however many people log in."
      cta_style: "quiet"
      features:
        - "A weekly list of small changes worth trying"
        - "One test every two weeks, with an honest answer on whether it worked"
        - "Your sales at a glance, day by day"
        - "Which menu items earn their place"
        - "What the places down the street charge, and what their guests say"
        - "Ask Alfredo your questions in plain words"
    - name: "House"
      who: "For one to three locations"
      price: "$199"
      per_day: "Less than $6.60 a day"
      per_day_note: "Less than $2.20 a day per location with three."
      flag: "The full picture"
      lead: "Everything in Counter, plus:"
      cta_style: "primary"
      features:
        - "Run as many tests as you like"
        - "Know your regulars and what they spend"
        - "See what you really make on every plate, extras included"
        - "Promotions and pairings worth suggesting"
        - "Every chart and every detail, nothing held back"
    - name: "Group"
      who: "For four to ten locations"
      price: "$299"
      per_day: "Less than $10 a day"
      per_day_note: "Less than $1 a day per location with ten."
      lead: "Everything in House, plus:"
      cta_style: "quiet"
      features:
        - "All your locations in one place"
        - "Compare locations side by side"
        - "The places down the street, tracked for each location"
  more_lead: "More than ten locations?"
  more_link: "Talk to us"
  more_tail: "and we will give you a straight number."
  proof: "Tested with a brewpub and live across a 14 location restaurant chain."
  proof_link: "Why you can trust it"
  compare_eyebrow: "For comparison"
  compare_heading: "What everyone else charges"
  # Alfredo is not a bar here. Its prices are in the cards above, and a bar
  # of our own next to three of theirs was the site arguing with itself.
  # The widths are given rather than computed: a consultant is a one off
  # fee, so there is no monthly scale that could hold all three honestly.
  compare_bars:
    - name: "A consultant"
      figure: "thousands, for one project"
      note: "Weeks of work, one report, then they leave."
      width: 100
      ink: "--c1"
    - name: "A big data platform"
      figure: "about $2,500 a month"
      note: "From around $30,000 a year, and you still need someone to build the reports."
      width: 85
      ink: "--c2"
    - name: "Back office software"
      figure: "$330 to $750 a month, per location"
      note: "Great for invoices and books. It tells you what you spent, not what to try next."
      width: 25
      ink: "--c3"
  compare_aria: "What everyone else charges each month: a consultant thousands for one project, a big data platform about $2,500, back office software $330 to $750 per location."
  compare_soft: "A consultant gives you a one time report."
  compare_gold: "Alfredo tells you what to try every week, then tells you whether it worked, for a fraction of the cost."
  faq_eyebrow: "Questions"
  faq_heading: "What owners ask first."
  faq:
    - q: "Which POS systems does Alfredo support?"
      a: "Toast and Clover today. If you run a different system, get in touch and we will tell you honestly whether yours is ready yet."
    - q: "Is there a contract?"
      a: "No long term contract. Month to month. We would rather earn the next month than lock you in."
    - q: "What counts as a location?"
      a: "One physical place: one restaurant, one taproom, one truck. Three registers in one restaurant is still one location."
    - q: "Does Alfredo know what my dishes cost to make?"
      a: "If you share your recipe and ingredient costs, yes, at no extra charge. If you do not, everything else still works."
  cta_heading: "Take one of the 10 spots."
  cta_body: "Founding partner spots go to businesses that want to shape the tool, not just use it."
