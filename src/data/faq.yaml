# Questions and answers, written answer first: the opening sentence answers
# the question outright, because that is the sentence a model quotes.
#
# Category phrases are allowed on this page by Sid's decision: restaurant
# analytics, menu engineering, POS data, sales data, Toast, Clover.
# "Intelligence" is still banned here as everywhere else, and so is every
# other house rule: no contractions, no dashes, no mechanism talk, the
# owner chooses the review window, prices only ever shown going down.
#
# The braces are filled by build.py from the pricing data and site.yaml, so
# a price or the spot count is written in exactly one place on this site.
# Never type a price or a count into an answer by hand.

eyebrow: "Questions and answers"
heading: "What owners ask about Alfredo."
lede: "Short answers, in the words owners use. If something here is not clear, ask us directly and we will tell you honestly."

entries:
  - q: "What is Alfredo?"
    a: "Alfredo by BakingInsightsAI is software that reads the sales you already ring through your POS and turns them into a short weekly list of changes worth trying. Each suggestion comes with why it came up, how much work it is, what it risks, how to do it, and when to check back. You decide what to try, and Alfredo comes back with an honest answer on whether it worked, did nothing, or backfired."

  - q: "Who is Alfredo for?"
    a: "Alfredo is for restaurants, bars, breweries, cafes and bakeries that ring their sales through a POS. It is built for the owner or manager who makes the decisions, not for a team of analysts. It has been tested with a brewpub and is live across a 14 location restaurant chain."

  - q: "What does Alfredo do with my sales data?"
    a: "Alfredo reads your POS sales and turns what it finds into a few changes worth trying each week. It also looks at your menu, your guests as far as your POS records who is who, and what the places down the street list publicly. Every figure it reports comes from your own sales, and if it cannot trace a number you do not see it."

  - q: "Does Alfredo work with Toast? With Clover? With Square or another POS?"
    a: "Toast and Clover are connected today. If you run Square or another POS system, get in touch and we will tell you honestly whether yours is ready yet. Connecting your POS needs no new hardware and no staff training."

  - q: "How much does Alfredo cost?"
    a: "Counter is {counter} {unit} for one location, House is {house} {unit} for one to three locations, and Group is {group} {unit} for four to ten. That is one price for your whole business, not per location and not per user, with no setup fee and month to month. If you run more than ten locations, talk to us and we will put together an arrangement that fits your group."

  - q: "Is there a free trial or founding offer?"
    a: "The first 10 businesses get everything free for six months, and {spots} of 10 spots are still open. Every feature is included, however many locations you run. After that you pay the price for your size, month to month, and that price stays locked for a full year."

  - q: "How is Alfredo different from a restaurant analytics dashboard?"
    a: "A dashboard shows you what happened and leaves the next move to you. Alfredo suggests what to try, as one short list each week, and then comes back with a verdict: it worked, it did nothing, or it backfired. Results stay hidden until a test is finished, so nobody calls it early."

  - q: "Can Alfredo help with menu engineering and food costs?"
    a: "Yes, once you share your recipes and ingredient costs. With those, Alfredo shows what each plate makes after the extras are counted, which items are selling below what they cost to make, and which ingredient is squeezing a plate. Without them, everything else still works."

  - q: "How do I know if a change worked?"
    a: "Every test ends one of three ways: it worked, it did nothing, or it backfired. You choose when to check back, and Alfredo suggests a date you can make shorter or longer. If the time you chose is not enough to call it, Alfredo says so rather than guess."

  - q: "Does Alfredo change my menu or prices on its own?"
    a: "No. Alfredo recommends and you decide. Nothing on your menu moves until you say so, and anything you try can be put back."

  - q: "How long does setup take?"
    a: "About two weeks. You request a demo and we reply within one business day, then a 30 minute call shows you Alfredo and what you would get from it. If you want to go ahead, we plan the setup together and connect your POS, with no new hardware and no staff training."

cta_heading: "Still have a question?"
cta_body: "Ask us directly and we will answer honestly, including when the answer is no. We reply within one business day, and a 30 minute call shows you Alfredo and what you would get from it."

# ---------------------------------------------------------------------------
# Question 12, "Is my data private?", is deliberately not published.
#
# The brief says to answer it only from facts already on the site. There are
# none: a search of every page and data file returns nothing about storage,
# retention, encryption, access, sub processors or sharing. The closest
# published statements are about figures, not privacy, and answering a
# privacy question with them would imply a promise nobody has made.
#
# To publish it, Sid needs to supply: where customer data is stored and in
# which country, how long it is kept, who inside the company can see it,
# whether any third party processor touches it, and whether anything is
# used to improve the product across customers. Once those are confirmed,
# add the entry above and the FAQPage structured data picks it up with no
# other change.
