# Site wide configuration. Copy lives here so layout edits never touch wording.

staging: true          # staging only: banner, noindex, robots.txt, test form subject
form_subject: "STAGING TEST demo request"
web3forms_key: "6ce52bfe-d286-44ff-992c-bb7565c31fb6"
app_url: "https://app.bakinginsightsai.com"

# The product is called Alfredo everywhere a reader sees it. The full name
# is for the places a machine reads: titles, og:site_name and structured
# data. "Alfredo" on its own is also a pasta sauce, which is exactly the
# confusion this avoids.
brand_name: "Alfredo by BakingInsightsAI"
site_url: "https://bakinginsightsai.com"

# One sentence, written to be quoted back. It is the description in the
# structured data, it opens llms.txt, and every meta description contains
# it. Change it here and it changes in all of them.
plain_sentence: "Alfredo by BakingInsightsAI is software for restaurants, bars, breweries, cafes and bakeries that reads your POS sales and turns them into a short weekly list of changes worth trying, then tells you honestly whether each one worked."

# Cloudflare Web Analytics: free, cookieless, and it reports the referrer,
# which is how a visit from chatgpt.com or perplexity.ai becomes visible.
# The beacon renders only when this is set and only when staging is false.
analytics_token: "ffcafa6e6d0c4d6cb2c519c7fc777fa6"

# Search console ownership. Each meta renders only when its value is set.
# The picture a link to this site shows when it is shared.
og_image: "assets/hero-restaurant-1280.jpg"

# The hero can play a muted video instead of the two still frames. Set this
# to the file's address and the hero swaps; leave it empty and the stills
# stay. That is the whole switch. The first still remains the poster, so a
# video that never arrives looks like no change at all.
hero_video: ""

google_site_verification: ""
bing_site_verification: ""

# How many founding places are still open. This is the only place the
# number is written: the home panel and the pricing offer both read it, so
# when a spot fills, one edit updates every page.
founding_spots_open: 9

# The founding offer, in Sid's words, written once. The home teaser, the
# pricing card and the questions page all read it from here, so the three
# cannot drift apart. The count above fills the dots and the sentence.
founding:
  label: "Founding offer."
  body: "The first 10 businesses get every feature, with no limits, free for six months."
  support: "However many locations you run. After that you pay the price for your size, month to month, and that price stays locked for a full year."
  spots_tail: "spots open"

footer_line: "\u00a9 2026 Alfredo, a BakingInsights AI product. Patent pending. We do not inflate numbers."

# The images are generated, and saying so on every page is a condition of
# using them. The handoff's own wording used a word this site does not use,
# so this is the reworded line.
image_disclosure: "Images are AI generated for illustration. No person or business shown is real."

contact:
  email: "contact@bakinginsightsai.com"
  instagram: "@alfredobybia"
  instagram_href: "https://www.instagram.com/alfredobybia/"
  facebook: "@alfredobybia"
  facebook_href: "https://www.facebook.com/alfredobybia"

# The order is the order of the story: what it does, why you can trust it,
# who we are, what it costs.
nav:
  - { label: "What it does", href: "product.html" }
  - { label: "Why trust it", href: "honesty.html" }
  - { label: "About us",     href: "pilot.html" }
  - { label: "Pricing",      href: "pricing.html" }

cta:
  label: "Request a demo"
  href: "pilot.html#pilot"

# Every page but the last hands the reader on to the next one. Pricing has
# no next: its last element is the demo call to action.
pages:
  - key: index
    template: index.html
    output: index.html
    legacy: false
    title: "Restaurant analytics | Alfredo by BakingInsightsAI"
    description: "Alfredo reads your POS sales and turns them into a short weekly list of changes worth trying, then tells you honestly whether each one worked."

  - key: product
    template: product.html
    output: product.html
    legacy: false
    title: "Weekly changes from POS data | Alfredo by BakingInsightsAI"
    description: "One short list of changes worth trying, every week. Each one says why it came up, what it risks, how to do it, and when to check back."
    next: { label: "Why you can trust the numbers", href: "honesty.html" }

  - key: honesty
    template: honesty.html
    output: honesty.html
    legacy: false
    title: "Why you can trust the numbers | Alfredo by BakingInsightsAI"
    description: "Every figure comes from your own sales. When there is not enough data to call a test, Alfredo says so rather than guess. The promise, in public."
    next: { label: "Why Alfredo exists", href: "pilot.html" }

  - key: pricing
    template: pricing.html
    output: pricing.html
    legacy: false
    title: "Pricing, from $99 a month | Alfredo by BakingInsightsAI"
    description: "Counter is $99 a month, House is $199 and Group is $299. One price for your whole business, not per location and not per user, and no setup fee."

  - key: faq
    template: faq.html
    output: faq.html
    legacy: false
    title: "Questions and answers | Alfredo by BakingInsightsAI"
    description: "Answers about Alfredo: what it is, who it is for, which POS systems it connects to, what it costs, and how it tells you whether a change worked."

  - key: pilot
    template: pilot.html
    output: pilot.html
    legacy: false
    title: "About us | Alfredo by BakingInsightsAI"
    description: "Why Alfredo exists, who it is built with, and where it is today. Tested with a brewpub, and live across a 14 location restaurant chain."
    next: { label: "What it costs", href: "pricing.html" }

# The three steps between a visitor and a working install. They are a real
# sequence, so they are rendered as an ordered list rather than as three
# cards that happen to sit left to right. Shown above the form on about us
# and above the closing band on pricing.
getting_started:
  heading: "Getting started"
  steps:
    - name: "Request a demo."
      body: "Tell us a little about your place. We reply within one business day."
    - name: "A 30 minute call."
      body: "We show you Alfredo and what you would get from it."
    - name: "Up and running in about two weeks."
      body: "If you want to go ahead, we plan the setup together and connect your POS."
