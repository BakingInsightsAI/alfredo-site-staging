# The homepage, v4. Every claim here is one of the approved ones, and
# every figure in the illustrative weekly list is invented, which is what
# the label on that card says.

hero:
  eyebrow: "For restaurants, bars, breweries, bakeries and cafes"
  # the second sentence is set in amber italic by the template
  heading_a: "Every business has a story."
  heading_b: "Your numbers know "
  heading_em: "what comes next."
  lede: "Alfredo turns your sales into a short list of clear, practical changes worth trying. Choose what to try, see what happens, and make your next decision with confidence."
  cta_secondary: "See the story"
  offer: "The first 10 businesses get everything free for six months."
  offer_href: "pricing.html"
  image_alt: "A dining room at the end of service, lit by low pendant lights."

# The card in the first screen. Short on purpose: it is the signal, not the
# showcase. None of these three appears again further down the page, so a
# reader who scrolls finds new suggestions rather than the same three in a
# bigger box.
hero_list:
  title: "This week"
  label: "Illustrative example"
  rows:
    - name: "Put the set lunch back on Thursdays"
      meta: "Thursday lunch is your quietest service"
    - name: "Staff the Friday rush from six"
      meta: "Orders start climbing before seven"
    - name: "Feature the house red by the glass"
      meta: "It earns more than the bottles beside it"

# Not five steps on a line. One owner's week, told in the order it
# happens, with the time of it rather than a step number: the point is
# that this is a Monday, not a process diagram.
week:
  eyebrow: "A week with it"
  heading: "One Monday, and the four weeks after."
  lede: "The same five moments every week, in your own sales. You decide at every one of them."
  moments:
    - when: "Monday morning"
      name: "The question"
      body: "Last week felt busy and the takings did not show it. You cannot say why, and you have a service to run."
    - when: "Still Monday morning"
      name: "The discovery"
      body: "Alfredo has already been through the week's sales and found what is behind it."
    - when: "Before service"
      name: "The choice"
      body: "A short list of small changes worth trying, each one easy to undo. You pick the ones that suit your place."
    - when: "The weeks after"
      name: "The test"
      body: "You make the change. Alfredo watches the weeks that follow and says nothing until it knows."
    - when: "Four weeks on"
      name: "The answer"
      body: "It worked, it did nothing, or it backfired. You find out which, and decide what comes next."

# The showcase is about range, not about one week: the whole weekly list
# lives on the product page. Four suggestions from four different corners
# of the business, each labelled with the kind it is, so a reader sees at a
# glance that this is not all one sort of advice. Price is deliberately not
# among them here: it is one kind of change on the product page, never the
# example the home page leads with.
weekly:
  eyebrow: "What lands every week"
  heading: "Not all one kind of change."
  lede: "A suggestion can come from any corner of your sales. Each one says what it is, why it came up, how much work it is, what it risks, and when to check back."
  # What used to be a separate section restating the same argument. Four
  # lines, each one answered by something on this page rather than by a
  # card of its own.
  marks:
    - "Changes to try, not charts to read."
    - "Every one of them comes out of your own sales."
    - "Every change ends in a verdict: worked, no effect, or backfired."
    - "Alfredo never changes a menu or a price on its own."
  statement: "Alfredo recommends. You decide."
  card_title: "Four kinds of suggestion"
  card_label: "Illustrative example"
  card_sub: "One week, four corners of your sales"
  recs:
    - kind: "Pairing"
      name: "Suggest the pale ale with the fish plate"
      why: "Guests who order the fish already order this beer more than any other."
      effort: "Low"
      risk: "Low"
      step: "Tell the floor on Thursday."
    - kind: "Cost"
      name: "Check the plate on the short rib"
      why: "The price you pay for it went up twice last month."
      effort: "Low"
      risk: "Low"
      step: "Confirm the new cost or dismiss the flag."
    - kind: "Neighborhood"
      name: "Try a coffee and pastry offer from two until four"
      why: "The bakery next door closes at two, and two until four is your quietest stretch."
      effort: "Medium"
      risk: "Low"
      step: "Run it for three weeks, then look."
    - kind: "Guests"
      name: "Win back 14 regulars who have gone quiet"
      why: "Last seen more than six weeks ago, and every one of them used to be in most weeks."
      effort: "Low"
      risk: "Low"
      step: "Write to them before the weekend."
  done_title: "Finished, with the answer"
  done:
    # the figure is the one the product page prints for the same sample
    - name: "House lager: $247 more a week"
      verdict: "Worked"
      kind: "worked"
      body: "Fifty cents off. Four weeks on, 78 more pints a week and the bar took $247 more. After what you would have made anyway."
    - name: "Calamari moved to the top of the starters"
      verdict: "No effect"
      kind: "none"
      body: "Four weeks on, it sold the same. Alfredo said so, and the top spot went to something that does move."
    - name: "Happy hour pushed an hour later"
      verdict: "Backfired"
      kind: "back"
      body: "The early crowd did not come back and the later hour did not fill. It went back the same night."

looks:
  eyebrow: "What Alfredo looks at"
  heading: "Your own sales, read the way an owner would read them."
  entries:
    - name: "Your menu"
      body: "What each plate really earns once the extras are counted, and which items to show off, keep or rethink."
    - name: "Your guests"
      body: "New faces, regulars, and the ones who have gone quiet and are worth winning back."
    - name: "Your costs"
      body: "Which ingredients went up, which plates they are squeezing, and what to do about it."
    - name: "The neighborhood"
      body: "What nearby places charge, when they are open, and what their guests keep saying."
    - name: "Your busy times"
      body: "Which days and hours carry the week, and which ones are quietly costing you."
    - name: "Your taproom"
      body: "House pours against guest pours, which beers earn their line, and what to put beside them."

audience:
  eyebrow: "Who it is for"
  heading: "Independent places, and small groups of them."
  cards:
    - label: "Restaurants"
      stem: "restaurant-kitchen"
      alt: "A cook finishing a dish on a kitchen pass."
    - label: "Bars"
      stem: "bar"
      alt: "A bar at night, a drink on the counter and bottles lit behind it."
    - label: "Breweries and taprooms"
      stem: "brewery"
      alt: "A brewer holding a glass of beer up to the light beside the tanks."
    - label: "Bakeries and cafes"
      stem: "bakery"
      alt: "A baker shaping dough on a floured bench beside racks of bread."

proof:
  claim: "Tested with a brewpub and live across a 14 location restaurant chain."
  note: "Patent pending."
