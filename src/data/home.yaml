# The home page, condensed glossy build.
#
# Five blocks instead of seven. The weekly board moved here from What it
# does and is now the first product moment, so the old 02 Reality section
# and the 03 three stage walkthrough are gone: the reality is one line
# beside the board, and the stages are what the board itself shows.
#
# The board's five suggestions are read from product.yaml rather than
# copied, so the same five records cannot drift into two versions. They
# render on this page only.

# ------------------------------------------------------------ 01 opening --
hero:
  eyebrow: "Alfredo for hospitality"
  heading_lines: ["Every business", "has a story."]
  sub: "Your numbers know what comes next."
  body: "Alfredo reads your sales, your menu, your guests and the places down the street, and turns them into clear, practical changes worth trying. You choose what to do. Alfredo helps you see what actually worked."
  cta: "See this week's list"
  cta_href: "#list"
  cta2: "Request a demo"
  cta2_href: "pilot.html#pilot"
  note: "For restaurants, bars, breweries, cafes and bakeries."
  chapter: "01 / The story"
  alt: "A dining room at the end of service, lit by low pendant lights."

# ------------------------------------------------------ 01b the weekly list --
# The board. Its five entries come from product.weeklist, which is also
# where the six fields are named, so there is one record of each.
board:
  eyebrow: "The weekly list"
  # N4. One line in place of the whole 02 Reality section, which ran to
  # 1,549px on a phone. Compressed from that section's own words: no new
  # claim is made here.
  reality: "You know when a Tuesday feels different. Alfredo is what finds out why, and what to do about it."
  heading: "Monday, the 6th"
  sub: "Five things worth trying this week"
  label: "Illustrative example"
  pick: "Pick one to read it"
  note: "The list comes every week on every plan. How many of them you run as a measured test is what the plans differ on."
  # the approved review window line, kept where the windows are shown
  window: "When to check back is the date you choose. Alfredo suggests one, and you can make it shorter or longer."
  fields:
    why: "Why it came up"
    effort: "How much work"
    risk: "What it risks"
    how: "How to do it"
    back: "When to check back"

# ----------------------------------------------------- 01c ownership strip --
# N2. The three stages the old walkthrough spent 1,165px explaining, as one
# band. The brand line appears here and nowhere else on this page.
strip:
  statement: "Alfredo recommends. "
  statement_em: "You decide."
  steps:
    - "It notices what moved in your own numbers."
    - "You decide what is worth trying."
    - "It comes back with an honest answer."

# -------------------------------------------------------------- 02 outcome --
proof:
  eyebrow: "The outcome"
  heading: "Not another dashboard. An answer."
  lede: "Alfredo does not just suggest a change and disappear. It helps you understand whether the change worked, did nothing, or made things worse."
  label: "Illustrative examples"
  honest: "If the time you chose is not enough to call it, Alfredo says so rather than guess."
  rows:
    - state: "Worked"
      kind: "worked"
      what: "Fifty cents off the House Lager"
      why: "Fifty cents off the House Lager. Three weeks later the bar took $247 more a week. After what you would have made anyway."
    - state: "No effect"
      kind: "none"
      what: "Calamari moved higher on the menu"
      why: "The test found no meaningful improvement."
    - state: "Backfired"
      kind: "back"
      what: "Happy hour shifted later"
      why: "The revised hours performed worse, so the change was reversed."

# --------------------------------------------------------------- 03 places --
places:
  eyebrow: "Built for hospitality"
  heading: "Different places. The same ambition to do better."
  cards:
    - cls: "pl-restaurant"
      stem: "restaurant-kitchen"
      label: "Restaurants"
      alt: "A cook finishing a dish on a kitchen pass."
    - cls: "pl-bar"
      stem: "bar"
      label: "Bars"
      alt: "A bar at night, a drink on the counter and bottles lit behind it."
    - cls: "pl-brewery"
      stem: "brewery"
      label: "Breweries"
      alt: "A brewer holding a glass of beer up to the light beside the tanks."
    # there is no cafe photograph in the repository, so the bakery picture
    # carries both, which is what its label says
    - cls: "pl-bakery"
      stem: "bakery"
      label: "Cafes and bakeries"
      alt: "A baker shaping dough on a floured bench beside racks of bread."

# ----------------------------------------------------- 04 proof and invite --
# The old 06 trust band and 07 invite, merged. The honesty rules live in
# full on Why trust it; this is the one line plus the link ahead.
close:
  eyebrow: "The next chapter"
  heading: "Your next chapter starts with better decisions."
  body: "We do not make up numbers. If Alfredo does not have enough information to know whether something worked, it says so."
  link: "Read the whole promise"
  link_href: "honesty.html"
  proof: "Tested with a brewpub and live across a 14 location restaurant chain."
  offer: "The first 10 businesses get everything free for six months."
  cta: "Request a demo"
  cta_href: "pilot.html#pilot"
  next_label: "What Alfredo does"
  next_href: "product.html"
  alt: "A bar at night, a drink on the counter and bottles lit behind it."
