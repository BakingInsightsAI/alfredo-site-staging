# The home page, v5. Seven moments, each with its own composition.
#
# Six strings below depart from the brief's exact wording, and each one is
# marked where it appears. All six are the site's standing copy rules, which
# the brief did not have in front of it: the banned word list, and no
# contractions. Nothing else was changed, and every one is a one line fix if
# Sid rules the other way.

# ------------------------------------------------------------ 01 opening --
hero:
  # brief: "INTELLIGENCE FOR HOSPITALITY". "intelligence" is on the banned
  # word list. Typed in sentence case, set in caps by the stylesheet, which
  # is the brief's eyebrow specification.
  eyebrow: "Alfredo for hospitality"
  # broken where the brief asks it to break, not wherever the box ends
  heading_lines: ["Every business", "has a story."]
  sub: "Your numbers know what comes next."
  body: "Alfredo turns your sales into clear, practical changes worth trying. You choose what to do. Alfredo helps you see what actually worked."
  cta: "See Alfredo in action"
  cta_href: "#meet"
  cta2: "Request a demo"
  cta2_href: "pilot.html#pilot"
  note: "For restaurants, bars, breweries, cafés and bakeries."
  chapter: "01 / The story"
  alt: "A dining room at the end of service, lit by low pendant lights."

# ------------------------------------------------------------ 02 tension --
tension:
  eyebrow: "02 / The reality"
  heading: "Good instincts deserve better information."
  body: "You know your guests. You know your team. You know when a Tuesday feels different. But between service, staffing and everything else, there is rarely time to dig through the numbers and find out why."
  # brief: "That's where Alfredo comes in." No contractions.
  close: "That is where Alfredo comes in."
  caption: "The decisions never stop when service starts."
  alt: "A cook finishing a dish on a kitchen pass."

# ------------------------------------------------------------- 03 reveal --
meet:
  eyebrow: "03 / Meet Alfredo"
  heading: "Clarity, before the next service."
  lede: "Every week, Alfredo finds patterns in your sales and turns them into decisions you can actually act on."
  ui_title: "Weekly briefing"
  # brief: "Example venue". "venue" is on the banned word list.
  ui_biz: "Example business"
  disclosure: "Illustrative product walkthrough. Not live customer data."
  tabs:
    - { key: "notice", label: "01 / Notice" }
    - { key: "decide", label: "02 / Decide" }
    - { key: "learn",  label: "03 / Learn" }

  notice:
    heading: "Your quietest lunch service is Thursday."
    body: "Your sales show fewer Thursday lunch orders than the other weekdays."
    rec_label: "What Alfredo suggests"
    rec: "Consider bringing back a Thursday lunch offer."
    effort: "Low"
    risk: "Low"
    chart_label: "Lunch orders by weekday"
    # There is no dataset behind this drawing, so it carries no scale, no
    # axis and no numbers, and the caption says exactly that.
    chart_note: "Relative shape only. No figures sit behind this drawing, so it carries no scale."
    chart_alt: "A drawing of five weekday bars with Thursday the shortest. It shows shape only and has no scale."
    days:
      - { day: "Mon", h: "tall" }
      - { day: "Tue", h: "mid" }
      - { day: "Wed", h: "tall" }
      - { day: "Thu", h: "short" }
      - { day: "Fri", h: "tall" }

  decide:
    heading: "Try a Thursday lunch offer."
    body: "A small, reversible change. Choose whether it fits your business."
    rows:
      - k: "Why this was suggested"
        v: "Thursday lunch has been your quietest weekday service for several weeks running, and nothing on the menu changed in that time."
      - k: "What you could try"
        v: "A set lunch on Thursdays only, at the price you already use the rest of the week."
      - k: "What to watch"
        v: "Whether Thursday covers come up without pulling guests off the other weekdays."
      - k: "When to review"
        v: "Four weeks from the day you start."
    controls: ["Try this", "Not right now"]
    sr: "Sample controls, shown to illustrate the choice. They do nothing on this page."
    note_a: "Alfredo recommends. You decide."
    note_b: "Nothing on your menu moves until you say so, and anything you try can be put back."

  learn:
    heading: "See what happened."
    body: "Four weeks on, Alfredo comes back with one of three answers. It is as willing to tell you the change did nothing as to tell you it worked."
    outcome: "The Thursday lunch offer ran for four weeks. Thursday covers came up and held, and the other weekdays did not fall. After what you would have made anyway."
    label: "This result"
    honest: "If four weeks is not enough to call it, Alfredo says so rather than guess."
    verdicts:
      - { name: "Worked", body: "The change did what it was meant to do.", result: true }
      - { name: "No effect", body: "Nothing moved. Worth knowing, and worth stopping.", result: false }
      - { name: "Backfired", body: "It went the other way, so put it back.", result: false }

# -------------------------------------------------------------- 04 proof --
proof:
  eyebrow: "04 / The outcome"
  heading: "Not another dashboard. An answer."
  # brief: "Alfredo doesn't just suggest". No contractions.
  lede: "Alfredo does not just suggest a change and disappear. It helps you understand whether the change worked, did nothing, or made things worse."
  label: "Illustrative examples"
  rows:
    - state: "Worked"
      kind: "worked"
      what: "House lager promotion"
      why: "An illustrative example of a change that improved results."
    - state: "No effect"
      kind: "none"
      what: "Calamari moved higher on the menu"
      why: "The test found no meaningful improvement."
    - state: "Backfired"
      kind: "back"
      what: "Happy hour shifted later"
      why: "The revised hours performed worse, so the change was reversed."
  statement: "Alfredo recommends. "
  statement_em: "You decide."

# ------------------------------------------------------------- 05 places --
places:
  eyebrow: "05 / Built for hospitality"
  heading: "Different places. The same ambition to do better."
  lede: "Whether you run a neighborhood café, a busy bar, an independent bakery, a brewery or a multi location restaurant group, your business has decisions worth understanding."
  cards:
    - cls: "pl-restaurant"
      stem: "restaurant-kitchen"
      label: "Restaurants"
      alt: "A cook finishing a dish on a kitchen pass."
    - cls: "pl-bar"
      stem: "bar"
      label: "Bars"
      alt: "A bar at night, a drink on the counter and bottles lit behind it."
    - cls: "pl-brewery"
      stem: "brewery"
      label: "Breweries"
      alt: "A brewer holding a glass of beer up to the light beside the tanks."
    # there is no café photograph in the repository, so the bakery picture
    # carries both, which is what its label says
    - cls: "pl-bakery"
      stem: "bakery"
      label: "Cafés & bakeries"
      alt: "A baker shaping dough on a floured bench beside racks of bread."

# -------------------------------------------------------------- 06 trust --
trust:
  eyebrow: "06 / Built on honesty"
  # brief: "We don't make up numbers." No contractions.
  heading: "We do not make up numbers."
  # brief: "If Alfredo doesn't have enough information". No contractions.
  body: "If Alfredo does not have enough information to know whether something worked, it says so. Not every experiment succeeds. Every useful experiment teaches you something."
  points:
    - "No invented figures."
    - "No pretending a test worked."
    - "No changing your business without you."
  link: "Read our approach to trust"
  link_href: "honesty.html"

# ------------------------------------------------------------- 07 invite --
invite:
  eyebrow: "The next chapter"
  heading: "Your next chapter starts with better decisions."
  body: "See what Alfredo could uncover in your business."
  cta: "Request a demo"
  cta_href: "pilot.html#pilot"
  link: "Explore what Alfredo does"
  link_href: "product.html"
  alt: "A bar at night, a drink on the counter and bottles lit behind it."
