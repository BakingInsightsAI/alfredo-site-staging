# Homepage copy. Captions come from the approved glass direction.

hero:
  heading: "The in house business consultant you never knew you had."
  lede: "Every week Alfredo reads your own sales and hands you a short list of small changes worth trying. Then it tells you honestly whether each one worked."

# The story is a film of one week on a sample menu. Each caption names the
# stage it belongs to by where the scroll has got to, and the menu below is
# marked up in the same order a person would read it.
captions:
  - { a: ".12", b: ".30",  line: "Every order you ring is already data.", note: "Your existing POS system. Nothing to install." }
  - { a: ".30", b: ".46",  line: "Alfredo reads all of it, every week.",  note: "So you do not have to." }
  - { a: ".46", b: ".70",  line: "Then marks up what is worth trying.",   note: "Small, low cost, reversible." }
  - { a: ".70", b: ".85",  line: "You pick one.",                         note: "Four weeks, one item, the same menu for every guest." }
  - { a: ".85", b: "1.01", line: "And you get an honest answer.",         note: "" }

# Every figure here is invented for the illustration, which is why the card
# carries a sample label and says so to a screen reader as well.
menu:
  title: "Menu"
  aria: "Sample menu marked up with four suggestions: raise Mozzarella Sticks from 6.99 to 7.49 dollars, dim the Calamari, pair Loaded Nachos with House IPA, and move weekday happy hour from 4 to 6pm to 5 to 7pm. The price change is picked, tracked for four weeks, and marked worked."
  unit: "a wk"
  pair_tag: "Pair with House IPA"
  moved_name: "Loaded Nachos"
  groups:
    - name: "Starters"
      rows:
        - { key: "mozz",   name: "Mozzarella Sticks", count: 290, price: "$6.99",  new: "$7.49", ring: true }
        - { key: "nachos", name: "Loaded Nachos",     count: 164, price: "$11.00", moves: true }
        - { key: "fries",  name: "Garlic Fries",      count: 212, price: "$5.50" }
        - { key: "cal",    name: "Calamari",          count: 38,  price: "$12.00", note: "Dim it" }
    - name: "On tap"
      slot_after: "ipa"
      rows:
        - { key: "ipa",   name: "House IPA",   count: 410, price: "$7.00" }
        - { key: "lager", name: "House Lager", count: 355, price: "$6.50" }
    - name: "Happy hour"
      rows:
        - { key: "hh", name: "Weekdays", price: "4 to 6pm", new: "5 to 7pm", wide: true }
  weeks: [false, false, true, false]

# labels for the player controls, which carry icons rather than words
film:
  play: "Play the film"
  pause: "Pause the film"
  replay: "Play from the start"
  chapters: "Chapters"
  chapter: "Chapter"

verdict:
  word: "Worked."
  note: "Or no effect. Or backfired."

tuesday:
  heading: "Why is Tuesday slow?"
  sub: "Three ways to ask. Only one gives you an answer you can act on."
  tiles:
    - { name: "A dashboard", body: "Hands you charts and leaves the interpretation to you." }
    - { name: "A consultant", body: "Hands you a ten slide deck of findings, too much information for a simple question." }
    - { name: "Alfredo", body: "Tells you what happened, why it happened, and how you can fix it. Then it checks whether the fix worked.", ours: true }

photos:
  - "Photo: bar at the end of service, warm light"
  - "Photo: plates leaving the pass"
  - "Photo: taps and a poured pint"

numbers:
  heading: "We do not inflate numbers."
  sub: "If the data is not there, the number is not there either."
  facts:
    - { name: "No estimates",     body: "Every figure traces back to your own transactions." }
    - { name: "Gaps stay visible", body: "Missing data is shown as missing, never filled with a guess." }
    - { name: "Three verdicts",   body: "Worked, no effect, or backfired." }
    - { name: "In production",    body: "Tested with a brewpub and live across a 14 location restaurant chain." }
  price_rows:
    - { label: "One location",   value: "$300 a month" }
    - { label: "Two locations",  value: "$500 a month" }
    - { label: "Three or more",  value: "A straight number on request", quiet: true }
  free: "The first 10 businesses get their first six months free."
