# The home page, v9 "ember".
#
# Order: the hero with the product window in it, the photograph, three
# outcome lines, the film, the track record, the pricing teaser, the
# closing, the handoff.
#
# Where the examples live, so nothing is shown twice:
#   this page   five weekly records in the product window and the film,
#               which follows the first of them through to a verdict
#   What it does  three suggestions of its own and flatbread_late, in its demo
#   the record  five finished tests, none of which is a current suggestion
#               except the one the film is in the middle of

# ------------------------------------------------------------ 01 the hero --
hero:
  pill_label: "Founding offer."
  pill_tail: "spots open"
  pill_href: "pricing.html"
  heading: "Every business has a story."
  heading_glow: "Your numbers know what comes next."
  sub: "Alfredo tells you what to try each week, then tells you honestly whether it worked."
  note: "For restaurants, bars, breweries, cafes and bakeries."
  cta: "Request a demo"
  cta_href: "pilot.html#pilot"
  cta2: "See this week"
  cta2_href: "#week"
  chapter: "01 / The story"

# --------------------------------------------------- 01b the weekly window --
# The product, as the hero object. The four suggestions are weekly records
# 0, 1, 2 and 4, read from product.yaml rather than copied. What is written
# here is only what the record does not carry: the answer a reader sees
# after choosing a date, which is this page's own illustration.
week:
  title: "This week"
  label: "Illustrative example"
  group_label: "Choose a suggestion"
  overline: "Recommendation"
  fields:
    why: "Why it came up"
    effort: "How much work"
    risk: "What it risks"
    how: "How to do it"
  # The introduction that sits above the board, in the board's own column.
  # The label is sentence case here and set in capitals by the stylesheet,
  # like every other label on this site.
  intro_label: "What you see each week"
  intro_body: "A short list of things to try, picked from your own sales. Open one to see why it came up and how to do it."
  try: "Try this"
  skip: "Not right now"
  date_label: "Choose when to check back"
  date_set: "Set review date"
  date_hint: "You choose the date. This is an illustrative example."
  date_missing: "Please choose when you want to check back."
  scheduled: "Review set"
  pending: "Pending"
  preview: "Preview an illustrative answer"
  tail: "This preview skips ahead to the date you chose. Illustrative example."
  owner: "Alfredo recommends. "
  owner_em: "You decide."
  # The five rows, in the order a reader meets them, each named rather than
  # numbered. The answers below are in the same order: one per row.
  entries: [sourdough_board, costs_tart, guests_quiet, reviews_speed, quiz_later]
  answers:
    - verdict: "Worked"
      kind: "worked"
      body: "In this illustrative result, the two were ordered together more often than before."
    - verdict: "Worked"
      kind: "worked"
      body: "In this illustrative result, the costs were confirmed and the tart was priced to cover them."
    - verdict: "No effect"
      kind: "none"
      body: "In this illustrative result, a few came back, not enough to call it a difference. Alfredo says so rather than dress it up."
    - verdict: "Worked"
      kind: "worked"
      body: "In this illustrative result, lunch covers came up."
    - verdict: "Backfired"
      kind: "back"
      body: "In this illustrative result, the later start lost the early crowd."

# --------------------------------------------------------- 02 the photograph
photo:
  heading: "You run the room. Alfredo watches the numbers."
  stem: "bar"
  alt: "A bar at night, a drink on the counter and bottles lit behind it."

# --------------------------------------------------------- 03 the outcomes
outcomes:
  - name: "Sell more of what already sells together."
    body: "Pairings your guests are already ordering."
  - name: "Catch a cost before it eats the week."
    body: "The ingredient that went up, and the plate it is squeezing."
  - name: "Know what the place down the street is doing."
    body: "Their prices, their hours, and what their guests say."
  - name: "Win back the regulars who have gone quiet."
    body: "Who stopped coming, and what might bring them back."
  - name: "Hear what guests are saying."
    body: "About you, and about the place down the street."

# --------------------------------------------------------------- 04 the film
# Fifteen seconds that pick up where the board above leaves off: the owner
# has tapped Try this on the first suggestion, and this is what happens
# next. Four steps, about 3.75 seconds each, and each one stays on screen,
# so at the end all four are there to read.
#
# The steps are laid out from the first paint and only fade in, so the card
# is the same height throughout and the animation cannot move the page.
# Before it plays, without scripting, and for a reader who asked for less
# motion, all four are simply visible.
#
# The figures are illustrative and sit under the card's own label. They add
# up: 31 of 120 is 26 percent, 18 of 118 is 15 percent.
film:
  eyebrow: "In 15 seconds"
  heading: "A suggestion. A decision. An answer."
  lede: "The owner chooses what to try and when to review. Alfredo comes back with the answer."
  topline: "How Alfredo follows through"
  label: "Illustrative example"
  origin_label: "Picks up from the board above"
  origin_name: "Offer the sourdough board with the cheese plate"
  weeks: ["Week 1", "Week 2", "Week 3", "Week 4"]
  play: "Play"
  pause: "Pause"
  replay: "Replay"
  progress_label: "How far through the film"
  steps:
    - at: 0
      label: "01 / You tap Try this"
      title: "Test started"
      text: "The four weeks before today are recorded as the starting point. The answer is due on 1 December."
    - at: 3750
      label: "02 / Four weeks of orders"
      text: "Alfredo counts the cheese plate orders, and how many of them add the sourdough board."
    - at: 7500
      label: "03 / The answer"
      verdict: "Worked"
      kind: "worked"
      text: "31 of 120 cheese plate orders added the sourdough board, up from 18 of 118 in the four weeks before."
      fine: "That is 26%, up from 15%."
    - at: 11250
      label: "04 / It goes on your record"
      row:
        date: "Dec 1"
        action: "Sourdough board with the cheese plate"
        verdict: "Worked"
        kind: "worked"

# ------------------------------------------------------- 05 the track record
# Five finished tests. None of them is a suggestion on any page: the four
# current ones are in the window above and on What it does, and these are
# what happened to earlier ones. The dates are illustrative, like the rows.
record:
  heading: "Track record"
  label: "Illustrative example"
  intro: "Every suggestion ends in one of three words. The ones that did not work stay on the record too."
  proof: "Tested with a brewpub and live across a 14 location restaurant chain."
  rows:
    - date: "Nov 3"
      action: "Thursday set lunch"
      verdict: "Pending"
      kind: "pending"
    - date: "Oct 27"
      action: "Fifty cents off the house lager"
      verdict: "Worked"
      kind: "worked"
    - date: "Oct 20"
      action: "Calamari moved to the top of the starters"
      verdict: "No effect"
      kind: "none"
    - date: "Oct 13"
      action: "Happy hour pushed an hour later"
      verdict: "Backfired"
      kind: "back"
    - date: "Oct 6"
      action: "Coffee offered with dessert after eight"
      verdict: "Worked"
      kind: "worked"

# ------------------------------------------------------ 06 the pricing teaser
teaser:
  heading: "One price for your whole business."
  link: "See what is included"
  link_href: "pricing.html"
  fine: "No setup fee. Month to month."

# ----------------------------------------------------------- 07 the closing
close:
  heading: "See it on your own numbers."
  body: "A short conversation about what Alfredo could help you try."
  cta: "Request a demo"
  cta_href: "pilot.html#pilot"
