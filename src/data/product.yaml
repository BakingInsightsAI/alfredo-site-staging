# Product page copy, in the words an owner would use.

tabs:
  - { key: overview, label: "Overview" }
  - { key: board,    label: "This week" }
  - { key: menu,     label: "Your menu" }
  - { key: intel,    label: "Your guests and neighbors" }

questions:
  - key: board
    q: "What should I change this week, and did it work?"
    a: "A short list of small changes. Try one and learn if it worked, did nothing, or backfired."
    cta: "See this week"
  # the two below are shared with the home tiles, see site.yaml
  - key: menu
    q: "Is my menu making me money?"
    shared: "menu_line"
    cta: "See your menu"
  - key: intel
    q: "Who is coming in, and what is happening down the street?"
    shared: "guests_line"
    cta: "See your guests and neighbors"

chat_chips:
  - q: "How am I doing this week?"
    a: "Revenue is up 4.2% week over week, most of it from Friday night. Orders are flat and average check is up $1.10. One thing to watch: Monday is still your softest day by a wide margin."
  - q: "What are my best sellers?"
    a: "Wings lead on volume, but your best seller is not your best earner: your highest margin mover is a mid shelf pour. Want the list sorted by profit instead of popularity?"
  - q: "What do you recommend?"
    a: "Three things on this week's list: a small price trial on your mozzarella sticks, a pairing nudge for loaded nachos with your house IPA, and one competitor pattern worth reading. Want to start with the one worth the most?"

board_types:
  - name: "Prices"
    body: "Which items can handle a small price bump, and which cannot."
  - name: "Pairings"
    body: "What your guests already like together, and what to suggest with it."
  - name: "Menu placement"
    body: "What to show off on the menu and what to quietly move down."
  - name: "How you run the floor"
    body: "Happy hour times, busy and slow hours, and how long tables stay."

# The House Lager result, printed on the this week tab and drawn small on
# the home tile and the overview card. Every figure is invented for the
# illustration and the card says so, but it has to add up: about 470 pints a
# week at 50 cents more is $235, and the dip in week three brings it to
# about $225, which is $11,700 over a year. The home page menu shows the
# same 470 pints.
measured:
  heading: "We raised the House Lager by 50 cents."
  label: "sample data"
  volume: "About 470 pints a week"
  weeks: [78, 92, 46, 86]
  # green is on target, red is below. Week four was grey, which this card's
  # own key calls not enough data, under a verdict that said it worked.
  kinds: ["ok", "ok", "low", "ok"]
  key: "green: on target, red: below, grey: not enough data that week."
  key_note: "After what you would have made anyway."
  lead: "Four weeks later: about"
  amount: "$225"
  tail: "more a week. That is about $11,700 a year."
  # the same result, short enough to sit under a word on a small drawing
  short: "About $225 more a week"

# The two outcomes a visitor can pick on the this week tab. They mirror the
# two cards above them: the 50 cent move is the House Lager that worked, the
# dollar move is the Garlic Fries that did not. Every figure is invented for
# the illustration and the card says so.
tryit:
  label: "Sample. Try it."
  heading: "Pick a change and see how the four weeks go"
  item: "House Lager"
  price: "$6.50"
  prompt: "Sample results, to show how a test plays out."
  again: "Start again"
  options:
    - key: "worked"
      button: "Raise 50 cents"
      new: "$7.00"
      # the same four weeks as the card above it, because it is the same
      # sample: two results that disagreed was the whole problem
      weeks: [78, 92, 46, 86]
      kinds: ["ok", "ok", "low", "ok"]
      verdict: "Worked"
      line: "Four weeks later: about $225 more a week. That is about $11,700 a year."
    - key: "backfired"
      button: "Raise one dollar"
      new: "$7.50"
      weeks: [64, 38, 30, 26]
      kinds: ["low", "low", "low", "low"]
      verdict: "Backfired"
      line: "Orders fell away and the week came out behind. It went back to $6.50 in minutes, and the board said so."

# One plate, broken down. Every figure here is invented for the illustration,
# which is why the card carries a sample label. The sums are consistent:
# price minus cost is what you make, on each line and on the total.
plate:
  dish: "House Burger"
  price: "$11.00"
  cost: "$4.10"
  make: "$6.90"
  addons:
    - { name: "Add bacon", price: "$2.00", cost: "$0.70", make: "$1.30" }
    - { name: "Add fries", price: "$3.50", cost: "$1.15", make: "$2.35" }
  total_label: "Plate with both"
  total_price: "$16.50"
  total_cost: "$5.95"
  total_make: "$10.55"
  note: "The dish is not the whole story. The two add ons are 35 percent of what this plate makes."
  aria: "Sample plate breakdown. House Burger sells for 11 dollars, costs 4 dollars 10 to make, and makes 6 dollars 90. Add bacon sells for 2 dollars, costs 70 cents, makes 1 dollar 30. Add fries sells for 3 dollars 50, costs 1 dollar 15, makes 2 dollars 35. The plate with both sells for 16 dollars 50, costs 5 dollars 95, and makes 10 dollars 55."

# The first card carries the cost anchor, because a link to #cost is a link
# to the breakdown of what a dish costs you.
menu_cards:
  - anchor: "cost"
    name: "Where the money goes"
    body: "Pick any dish and see what it really costs you, ingredient by ingredient."
  - name: "What to keep an eye on"
    body: "See which ingredients would hurt most if their price jumped."
  - name: "Costs that crept up"
    body: "Cheese went up, your menu price did not. Alfredo shows what that costs you each week."
  - name: "Mistakes caught early"
    body: "On day one with a real client, Alfredo caught a cost off by 1,370 times and asked first."
  - name: "Try it small first"
    body: "Test a new price or a new spot on the menu with one item before you change the whole menu."

guest_groups:
  - { name: "The Friday night crowd", guests: "124 guests", check: "$47 average check", visits: "3.1 visits", body: "Weekend evenings, bigger tables, mostly drinks." }
  - { name: "Lunch break locals",     guests: "96 guests",  check: "$22 average check", visits: "5.8 visits", body: "Weekday lunches, in and out fast, back often." }
  - { name: "Slow sippers",           guests: "58 guests",  check: "$29 average check", visits: "6.4 visits", body: "Stay a long while, drinks only. A snack suggestion could go a long way." }
  - { name: "Big table hosts",        guests: "34 guests",  check: "$118 average check", visits: "2.2 visits", body: "They bring the group. Fewer visits, the biggest checks in the house." }

intel_stats:
  - { n: "36",      label: "places tracked in your area" }
  - { n: "8 of 36", label: "open past midnight: your late night edge" }
  - { n: "+1.1",    label: "your service score against the area average" }
  - { n: "1 click", label: "from any nearby place to their whole menu" }

radar:
  cx: 100
  cy: 100
  r: 78
  axes:
    - { name: "Food", you: 0.86, market: 0.7, ux: 0.0, uy: -1.0 }
    - { name: "Service", you: 0.82, market: 0.64, ux: 0.9511, uy: -0.309 }
    - { name: "Value", you: 0.68, market: 0.72, ux: 0.5878, uy: 0.809 }
    - { name: "Speed", you: 0.74, market: 0.66, ux: -0.5878, uy: 0.809 }
    - { name: "Ambiance", you: 0.0, market: 0.0, ux: -0.9511, uy: -0.309, faded: true, note: "not enough reviews" }

scanner:
  - { theirs: "Smash Burger", theirprice: "$13.50", yours: "House Burger",   yourprice: "$11.00", gap: "You are $2.50 under", action: "Try this price" }
  - { theirs: "Loaded Tots",  theirprice: "$9.00",  yours: "Tater Tots",     yourprice: "$8.00",  gap: "You are $1.00 under", action: "Confirmed" }
  - { theirs: "Chicken Sando", theirprice: "$12.00", yours: "Crispy Chicken", yourprice: "$12.50",  gap: "Needs your review", action: "Review" }

also_included: "Also included: what reviews in your area keep saying, a map of nearby competitors, who lives and works around you, whether nearby bars send you late night guests, what longer hours could bring in, and where your prices sit in the area."
