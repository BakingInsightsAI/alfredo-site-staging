# Product page copy. Reused verbatim from the approved pages except for the
# six sentences that carried banned mechanism wording; those are noted in the
# commit message and in the report.

tabs:
  - { key: overview, label: "Overview" }
  - { key: board,    label: "The weekly board" }
  - { key: menu,     label: "Menu and margins" }
  - { key: intel,    label: "Guests and competition" }

questions:
  - key: board
    q: "What should I do this week, and how do I know it worked?"
    a: "The weekly board is a short list of recommendations from your own data, and every one you try comes back with an honest verdict: worked, no effect, or backfired."
    cta: "Explore the weekly board"
  - key: menu
    q: "Is my menu making me money?"
    a: "The menu lab lets you test changes safely, and cost intelligence connects what each dish costs to make with what it sells for."
    cta: "Explore menu and margins"
  - key: intel
    q: "Who is in my room, and what is happening on my street?"
    a: "Customer intelligence finds your confirmed guests and regulars from data you already have. Competitive intel watches the venues around you."
    cta: "Explore guests and competition"

chat_chips:
  - q: "How am I doing this week?"
    a: "Revenue is up 4.2% week over week, most of it from Friday night. Orders are flat and average check is up $1.10. One thing to watch: Monday is still your softest day by a wide margin."
  - q: "What are my best sellers?"
    a: "Wings lead on volume, but your best seller is not your best earner: your highest margin mover is a mid shelf pour. Want the list ranked by profit instead of popularity?"
  - q: "What do you recommend?"
    a: "Three recommendations on this week's board: a small price trial on your mozzarella sticks, a pairing nudge for loaded nachos with your house IPA, and one competitor pattern worth reading. Want to start with the one worth the most?"

board_types:
  - name: "Pricing"
    body: "Which items can carry a price move, which cannot, and a built in way to prove it on one item before you commit the whole menu."
  - name: "Promotions"
    body: "Bundles and pairings pulled from your real baskets, with the co order evidence attached. Not your best seller. The pairing you would not have guessed."
  - name: "Positioning"
    body: "Where each item sits on your menu and in your market: highlight the hidden gems, dim the underperformers, watch the gaps your competitors leave open."
  - name: "Operations"
    body: "Table time, dayparts, happy hour economics, item availability. Where the floor and the data disagree, you find out early."

menulab_tiles:
  - name: "Suggestions with receipts"
    body: "Up to ten at a time, each carrying its evidence: co order lift, competitor prices, margin math, verbatim lines from your own reviews."
  - name: "Four clicks to a fair trial"
    body: "Pick the item, pick the change, pick a control, pick a duration. Alfredo proposes control items. You decide."
  - name: "An honest scoreboard"
    body: "Your edits tally into estimated impact, and the scoreboard keeps estimates and measured results clearly apart. They never blend."

cost_tiles:
  - name: "Where each dish's money goes"
    body: "Click any item and see its cost ingredient by ingredient: which single ingredient dominates, what packaging adds, and when each cost was last confirmed. Every cost carries its date, so you always know how fresh the number is."
  - name: "The worry list, before the worry"
    body: "Alfredo shows the ingredients that drive your menu wide costs, what a 10 percent price rise in each would cost you per month, and how volatile each has been over the past year."
  - name: "Where costs rose but prices did not"
    body: "The repricing queue finds items whose ingredient costs climbed while menu prices stood still, quantifies the weekly margin bleed, and feeds the worst cases into the weekly board. It shows the mirror too: where costs fell and margins quietly improved."
  - name: "It audits the data itself"
    body: "Items selling below cost, suspicious entries, stale costs, sudden spikes. On day one with a real client's cost data, Alfredo flagged a 1,370 times data entry error. It asked the operator instead of silently fixing it. Every finding is a question you confirm or dismiss."

